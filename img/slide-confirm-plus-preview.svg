<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Slide Confirm Plus color controls preview</title>
  <desc id="desc">A blue slide to confirm control with a white handle, alongside a visual editor with color swatches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="64" y="86" fill="#fff" font-family="system-ui, sans-serif" font-size="38" font-weight="700">Open Door</text>
  <text x="64" y="126" fill="#b7c5dc" font-family="system-ui, sans-serif" font-size="22">Clear, high-contrast slide confirmation</text>
  <rect x="64" y="168" width="610" height="76" rx="38" fill="#0d47a1" filter="url(#shadow)"/>
  <text x="360" y="214" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="23" font-weight="650">Slide to open</text>
  <circle cx="104" cy="206" r="32" fill="#fff" stroke="#082f70" stroke-width="3"/>
  <path d="M95 194h14v24H95z M98 205h8 M106 210h3" fill="none" stroke="#0d47a1" stroke-width="3" stroke-linecap="round"/>
  <text x="64" y="316" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Visual editor</text>
  <rect x="64" y="340" width="610" height="110" rx="16" fill="#ffffff" opacity=".96"/>
  <text x="92" y="378" fill="#26354f" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Background</text>
  <rect x="92" y="393" width="120" height="34" rx="7" fill="#0d47a1"/>
  <text x="236" y="378" fill="#26354f" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Handle</text>
  <rect x="236" y="393" width="120" height="34" rx="7" fill="#fff" stroke="#95a3b8"/>
  <text x="380" y="378" fill="#26354f" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Success</text>
  <rect x="380" y="393" width="120" height="34" rx="7" fill="#2e7d32"/>
  <text x="800" y="114" fill="#fff" font-family="system-ui, sans-serif" font-size="31" font-weight="700">No CSS needed</text>
  <text x="800" y="159" fill="#b7c5dc" font-family="system-ui, sans-serif" font-size="22">Pick colors. Adjust size.</text>
  <text x="800" y="194" fill="#b7c5dc" font-family="system-ui, sans-serif" font-size="22">See the live preview.</text>
  <circle cx="760" cy="105" r="12" fill="#60a5fa"/><circle cx="760" cy="145" r="12" fill="#fff"/><circle cx="760" cy="185" r="12" fill="#4ade80"/>
</svg>
